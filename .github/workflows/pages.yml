name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages:    write
  id-token: write

concurrency:
  group:             pages
  cancel-in-progress: false

jobs:
  # Gate the deploy on the full CI job so a red main never ships.
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      # No build step — publish only what the browser loads. Server code, tests,
      # tooling and docs stay out of the public site.
      - name: Assemble site
        run: |
          mkdir -p _site/src
          cp index.html play.html _site/
          cp -r questions _site/
          cp src/*.js _site/src/
          rm _site/src/*.test.js

      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id:   deployment
        uses: actions/deploy-pages@v4
